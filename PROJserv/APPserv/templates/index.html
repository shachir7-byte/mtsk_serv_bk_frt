<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>API Test Sandbox - PROJserv</title>
</head>
<body style="font-family: monospace; padding: 20px;">
    <h2>Технический пульт проверки бэкенда (APPserv)</h2>

<div style="margin-bottom: 15px;">
        <label>Token (ZMS):</label>
        <input type="text" id="tokenInput" value="{{ zms_token }}" style="width: 360px;">
        <button onclick="callApi('/api/seed-database/', 'POST')" style="background: #d1fae5; font-weight: bold; cursor: pointer;">
            1. Заполнить БД демо-данными (Seed)
        </button>
        <a href="/admin/" target="_blank" style="margin-left: 15px;">Открыть /admin/</a>
    </div>

    <div style="margin-bottom: 10px;">
        <strong>Чтение (DRF + Кэш + Ручная сериализация):</strong><br><br>
        <button onclick="callApi('/api/orders/', 'GET')">GET /api/orders/</button>
        <button onclick="callApi('/api/clients/', 'GET')">GET /api/clients/</button>
        <button onclick="callApi('/api/clients/by-phone/?phone=912', 'GET')">GET Поиск по тел (?phone=912)</button>
        <button onclick="callApi('/api/stock-items/', 'GET')">GET /api/stock-items/</button>
        <button onclick="callApi('/api/donors/', 'GET')">GET /api/donors/</button>
        <button onclick="callApi('/api/shifts/', 'GET')">GET /api/shifts/</button>
        <button onclick="callApi('/api/manual-services/', 'GET')">GET CBV /api/manual-services/</button>
        <button onclick="callApi('/api/async-supplier-check/', 'GET')">ASYNC aiohttp (3 котировки)</button>
    </div>

    <div style="margin-bottom: 15px;">
        <strong>Бизнес-операции (POST @action):</strong><br><br>
        <button onclick="callApi('/api/payments/apply-donor-credit/', 'POST', {order_id: 1, donor_id: 1})">
            Зачесть донорский кредит (4000 ₽) в Заказ #1
        </button>
        <button onclick="callApi('/api/donors/1/disassemble/', 'POST', {terminal_id: 1, part_ids: [1, 2]})">
            Разобрать Донор #1 на запчасти (на склад)
        </button>
        <button onclick="callApi('/api/orders/1/transition/', 'POST', {status: 'ready', comment: 'Ремонт завершен, протестировано'})">
            Перевести Заказ #1 в статус Готов (ready)
        </button>
        <button onclick="callApi('/api/shifts/1/close/', 'POST', {})">
            Закрыть кассовую смену #1 (сверка кассы)
        </button>
    </div>

    <div style="margin-bottom: 15px;">
        <input type="text" id="customUrl" value="/api/orders/period/week/2026-11-01/" style="width: 340px;">
        <button onclick="callApi(document.getElementById('customUrl').value, 'GET')">Выполнить GET</button>
    </div>

    <div style="margin-bottom: 15px;">
        <strong>WebSocket тест (ws/orders/):</strong>
        <button onclick="sendWs()">Отправить статус через WS</button>
        <span id="wsOutput">Ожидание...</span>
    </div>

    <pre id="responseBox" style="background: #f0f0f0; padding: 15px; border: 1px solid #ccc; min-height: 260px; white-space: pre-wrap;"></pre>

    <script>
        async function callApi(url, method, bodyObj = null) {
            const token = document.getElementById('tokenInput').value.trim();
            const options = {
                method: method,
                headers: {
                    'Authorization': 'Token ' + token,
                    'Content-Type': 'application/json'
                }
            };
            if (bodyObj) {
                options.body = JSON.stringify(bodyObj);
            }
            const res = await fetch(url, options);
            const data = await res.json();
            document.getElementById('responseBox').textContent = JSON.stringify(data, null, 2);
        }

        let ws = new WebSocket('ws://' + window.location.host + '/ws/orders/');
        ws.onmessage = (message) => {
            document.getElementById('wsOutput').textContent = message.data;
        };

        function sendWs() {
            ws.send(JSON.stringify({ order_id: 1, status: 'ready' }));
        }
    </script>
</body>
</html>
